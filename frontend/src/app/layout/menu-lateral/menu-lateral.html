<aside class="nav" id="nav" aria-label="Navegación del módulo">
  <button class="tg" id="tg" type="button" (click)="alternar.emit()" [attr.aria-expanded]="!colapsado()" aria-controls="ni" [attr.aria-label]="colapsado() ? 'Mostrar menú' : 'Ocultar menú'">
    <i class="ti" [class.ti-layout-sidebar-left-collapse]="!colapsado()" [class.ti-layout-sidebar-left-expand]="colapsado()"></i>
    <span>{{ colapsado() ? 'Mostrar menú' : 'Ocultar menú' }}</span>
  </button>
  <div class="tgd" aria-hidden="true"></div>
  <div id="ni" class="nlist">
    @if (activo.modulo(); as m) {
      @for (x of activo.nav(); track x.ruta) {
        <a class="ni" [routerLink]="['/', m.ruta, x.ruta]" routerLinkActive #rla="routerLinkActive"
           [attr.aria-current]="rla.isActive ? 'page' : null" [attr.aria-label]="x.etiqueta" (click)="navegar.emit()">
          <i class="ti ti-{{ x.icono }}"></i><span>{{ x.etiqueta }}</span>
          @if (insignia(x.ruta); as n) { <em class="bdg" [attr.aria-label]="n + ' sin leer'">{{ n }}</em> }
        </a>
      }
    }
  </div>
</aside>
