# Producción: Angular estático + /api hacia Django en el mismo dominio (sin CORS).
server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/   { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
}
